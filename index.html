function companyForm(){const c=TN.company;openForm({title:'Edit company profile',data:{...c},fields:[{k:'name',l:'Brand name',req:1,sp:3},{k:'legal',l:'Legal name',sp:3},{k:'industry',l:'Industry',t:'select',o:INDUSTRIES,sp:3},{k:'size',l:'Company size',t:'select',o:SIZES,sp:3},{k:'taxId',l:CTRY().tax,sp:3},{k:'regNo',l:'Registration no.',sp:3},{k:'address',l:'Address',t:'textarea',sp:6},{k:'city',l:'City',sp:2},{k:'email',l:'Email',t:'email',sp:2},{k:'phone',l:'Phone',sp:2},{k:'empPrefix',l:'Employee ID prefix',req:1,sp:2},{k:'noticeDays',l:'Notice period (days)',t:'number',min:0,sp:2},{k:'payDay',l:'Salary pay day',t:'number',min:1,max:28,sp:2}],save:d=>{Object.assign(c,{name:d.name,legal:d.legal,industry:d.industry,size:d.size,taxId:d.taxId,regNo:d.regNo,address:d.address,city:d.city,email:d.email,phone:d.phone,empPrefix:String(d.empPrefix).toUpperCase().slice(0,4),noticeDays:+d.noticeDays||0,payDay:+d.payDay||28});audit('Company profile updated','Settings',c.name);save();render();toast('Company profile saved')}})}

function fxForm(){const cur=['USD','EUR','GBP','INR','AED','SGD','AUD','CAD'].filter(x=>x!==TN.company.currency),d={};cur.forEach(x=>d['fx_'+x]=r2(netBase(1,x)*1e4)/1e4);
 openForm({title:`Exchange rates (1 unit = ? ${TN.company.currency})`,data:d,fields:cur.map(x=>({k:'fx_'+x,l:'1 '+x,t:'number',step:'any',min:0,sp:3})),save:v=>{cur.forEach(x=>{if(+v['fx_'+x]>0)TN.fx[x]=+v['fx_'+x]});audit('Exchange rates updated','Settings','');save();render();toast('Rates saved')}})}

function cfForm(id){const f=id?TN.customFields.find(x=>x.id===id):null;openForm({title:f?'Edit field':'Add custom field',data:f?{...f,on:f.on!==false}:{name:'',type:'text',opts:'',req:false,on:true},fields:[{k:'name',l:'Field name',req:1,sp:4},{k:'type',l:'Type',t:'select',o:['text','number','date','select'],sp:2},{k:'opts',l:'Options (for select — comma separated)',sp:6},{k:'req',l:'Required when adding employees',t:'check',sp:3},{k:'on',l:'Active',t:'check',sp:3}],size:'n',validate:d=>d.type==='select'&&!d.opts?'Add options for a select field':'',save:d=>{if(f)Object.assign(f,d);else TN.customFields.push({id:uid('CF'),...d});audit('Custom field saved','Settings',d.name);save();render();toast('Field saved')}})}

PAGES.integrations=()=>{if(role()!=='admin')return admOnly();const tab=curTab(['Apps','API keys','Webhooks']);let body='';
 if(tab==='Apps')body=`<div class="note mb">${I('plug')}<div><b>${isPro()?'Advanced':'Basic'} integrations.</b> ${isPro()?'All connectors, webhooks and scoped API keys are available.':'CSV, Google and email are included. Upgrade to Professional for every connector, webhooks and scoped API keys.'}</div></div><div class="g3">${INTEG.map(([k,n,d,adv,ic])=>{const on=(TN.integrations[k]||{}).on,locked=adv&&!isPro();return `<div class="panel"><div class="sp" style="align-items:flex-start"><span class="badge p" style="padding:8px">${I(ic,18)}</span>${on?'<span class="badge">Connected</span>':locked?'<span class="badge g">Professional</span>':''}</div><b style="display:block;margin-top:10px">${n}</b><div class="sm mu" style="margin:4px 0 12px">${d}</div>${locked?`<button class="btn s" onclick="upgradeFlow('professional')">Upgrade to connect</button>`:`<button class="btn s ${on?'':'pri'}" onclick="integToggle('${k}')">${on?'Disconnect':'Connect'}</button>`}</div>`}).join('')}</div><div class="note mt">${I('spark')}<div><b>WhatsApp automation</b> and <b>digital document storage</b> are on the roadmap.</div></div>`;
 if(tab==='API keys'){const max=isPro()?99:1;body=`<div class="sp mb"><div class="sm mu">${isPro()?'Create read or read-write keys for your own systems.':'Basic API: one read-only key. Upgrade for scoped read-write keys.'}</div><button class="btn pri" onclick="keyForm()" ${TN.apiKeys.filter(k=>k.status==='Active').length>=max?'disabled':''}>${I('plus')}Create key</button></div>`+tbl('keys',[['Name',k=>`<b>${esc(k.name)}</b>`],['Key',k=>`<code>${esc(k.prefix)}••••••••</code>`],['Scope',k=>bd(k.scope==='read'?'Read-only':'Read & write','g')],['Created',k=>fdate(k.created)],['Last used',k=>fdate(k.last)],['Status',k=>bd(k.status)],['','','r'].map((z,i)=>i===0?['',k=>k.status==='Active'?`<button class="btn s" onclick="keyRevoke('${k.id}')">Revoke</button>`:'','r']:z)[0]],TN.apiKeys,{et:'No API keys'})+panel('Quick start',`<pre style="margin:0;overflow:auto;font-size:12px;background:var(--sf2);padding:14px;border-radius:10px">curl https://api.atmora.example/v1/employees \\\n  -H "Authorization: Bearer atm_live_••••••••"</pre><div class="xs mu mt2">Illustrative endpoint — the prototype does not run a live API.</div>`,'','mt')}
 if(tab==='Webhooks')body=isPro()?`<div class="tbar"><div class="grow"></div><button class="btn pri" onclick="hookForm()">${I('plus')}Add webhook</button></div>`+tbl('hooks',[['Endpoint',h=>`<b class="sm">${esc(h.url)}</b>`],['Events',h=>esc(h.events.join(', '))],['Last delivery',h=>h.last?`${fdt(h.last)} · ${bd('Delivered')}`:'—'],['Status',h=>bd(h.on?'Active':'Inactive')],['','','r'].map((z,i)=>i===0?['',h=>`<button class="btn s" onclick="hookTest('${h.id}')">Send test</button><button class="btn s" onclick="hookDel('${h.id}')">${I('trash',14)}</button>`,'r']:z)[0]],TN.hooks,{et:'No webhooks',ed:'Receive events such as employee_added or leave_approved at your URL.'}):`<div class="panel">${lockMini('integrations_adv')}</div>`;
 return ph('Integrations & API','Connect ATMORA to the tools you already use.')+tabsBar(['Apps','API keys','Webhooks'])+body};
function integToggle(k){const i=TN.integrations[k];if(i&&i.on){TN.integrations[k]={on:false}}else TN.integrations[k]={on:true,on_at:TODAY};audit('Integration '+(TN.integrations[k].on?'connected':'disconnected'),'Integrations',k);save();render();toast(TN.integrations[k].on?'Connected':'Disconnected')}
function keyForm(){openForm({title:'Create API key',data:{name:'',scope:'read'},fields:[{k:'name',l:'Key name',req:1,sp:6},{k:'scope',l:'Scope',t:'select',o:isPro()?[['read','Read-only'],['write','Read & write']]:[['read','Read-only']],sp:6}],size:'n',save:d=>{const secret='atm_live_'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,18);TN.apiKeys.unshift({id:uid('K'),name:d.name,prefix:secret.slice(0,13),scope:d.scope,created:TODAY,last:'',status:'Active'});audit('API key created','Integrations',d.name);save();closeModal();render();openModal('Copy your API key',`<div class="note w mb">${I('info')}<div>This is the only time the full key is shown.</div></div><code style="display:block;padding:12px;background:var(--sf2);border-radius:10px;word-break:break-all">${secret}</code>`,undefined,'n');return false}})}

const HOOK_EV=['employee_added','leave_applied','leave_approved','payroll_finalized','expense_submitted'];
function hookForm(){openForm({title:'Add webhook',data:{url:'https://',ev:'employee_added'},fields:[{k:'url',l:'Endpoint URL',req:1,sp:6},{k:'ev',l:'Event',t:'select',o:HOOK_EV,sp:6}],size:'n',validate:d=>/^https:\/\/.+\..+/.test(d.url)?'':'Enter a valid https:// URL',save:d=>{TN.hooks.push({id:uid('WH'),url:d.url,events:[d.ev],on:true,last:''});audit('Webhook added','Integrations',d.url);save();render();toast('Webhook added')}})}

const STAGES=['Applied','Screening','Interview','Offer','Hired','Rejected'];let DRAG=null;
const jobOf=id=>TN.recruit.jobs.find(j=>j.id===id)||{title:'—'};
PAGES.recruitment=()=>{if(!isAdm())return admOnly();const R=TN.recruit,tab=curTab(['Pipeline','Jobs']),fj=getF('rec','job');let body='';
 if(tab==='Pipeline'){const cs=R.cands.filter(c=>!fj||c.job===fj);
  body=`<div class="tbar"><select onchange="setF('rec','job',this.value)" aria-label="Job"><option value="">All jobs</option>${optsHtml(R.jobs.map(j=>({v:j.id,l:j.title})),fj)}</select><div class="grow"></div><button class="btn pri" onclick="candForm()">${I('plus')}Add candidate</button></div><div class="kan">${STAGES.map(s=>{const l=cs.filter(c=>c.stage===s);return `<div class="kc" ondragover="event.preventDefault();this.classList.add('ov')" ondragleave="this.classList.remove('ov')" ondrop="this.classList.remove('ov');dropCand('${s}')"><h4><span>${s}</span><span>${l.length}</span></h4>${l.map(c=>`<div class="kcard" draggable="true" ondragstart="DRAG='${c.id}'" onclick="candView('${c.id}')"><b>${esc(c.name)}</b><div class="xs mu">${esc(jobOf(c.job).title)}</div><div class="xs mu mt2">${c.exp} yrs · ${esc(c.source)}</div>${c.interview&&s==='Interview'?`<div class="xs mt2">${I('cal',12)} ${fdate(c.interview.date)} ${ftime(c.interview.time)}</div>`:''}${c.rating?`<div class="xs" style="color:#f0a53a">${rating(c.rating)}</div>`:''}</div>`).join('')||'<div class="xs mu c" style="padding:14px">Drop here</div>'}</div>`}).join('')}</div>`}
 if(tab==='Jobs')body=`<div class="tbar"><div class="grow"></div><button class="btn pri" onclick="jobForm()">${I('plus')}Post job</button></div>`+tbl('jobs',[['Job',j=>`<b>${esc(j.title)}</b><div class="xs mu">${esc(nm('departments',j.dept))} · ${esc(nm('locations',j.loc))}</div>`],['Type',j=>esc(j.type)],['Openings',j=>j.openings],['Candidates',j=>R.cands.filter(c=>c.job===j.id).length],['Hired',j=>R.cands.filter(c=>c.job===j.id&&c.stage==='Hired').length],['Posted',j=>fdate(j.posted)],['Status',j=>bd(j.status)],['','','r'].map((z,i)=>i===0?['',j=>`<button class="btn s" onclick="jobForm('${j.id}')">Edit</button>`,'r']:z)[0]],R.jobs,{et:'No jobs yet',ed:'Post a job to start hiring.'});
 return ph('Recruitment','Post openings, track candidates and convert hires into employees.')+kpis([['Open jobs',R.jobs.filter(j=>j.status==='Open').length,''],['Active candidates',R.cands.filter(c=>!['Hired','Rejected'].includes(c.stage)).length,'in pipeline'],['Interviews',R.cands.filter(c=>c.stage==='Interview').length,'scheduled'],['Offers out',R.cands.filter(c=>c.stage==='Offer').length,''],['Hired',R.cands.filter(c=>c.stage==='Hired').length,'all time']])+tabsBar(['Pipeline','Jobs'])+body};
function dropCand(s){if(DRAG)candStage(DRAG,s);DRAG=null}
function candStage(id,s){const c=TN.recruit.cands.find(x=>x.id===id);if(!c||c.stage===s)return;
 if(c.stage==='Hired')return toast('Hired candidates are already employees','er');
 if(s==='Rejected')return rejectCand(id);if(s==='Hired')return hireCand(id);if(s==='Offer'&&!c.offer)return offerForm(id);if(s==='Interview'&&!c.interview)return interviewForm(id);
 c.stage=s;audit('Candidate moved','Recruitment',`${c.name} → ${s}`);save();render()}
function candView(id){const c=TN.recruit.cands.find(x=>x.id===id),j=jobOf(c.job);
 openModal(c.name,`${dg([['Applied for',esc(j.title)],['Stage',bd(c.stage,c.stage==='Hired'?'':c.stage==='Rejected'?'e':'i')],['Experience',c.exp+' years'],['Email',esc(c.email)],['Phone',esc(c.phone)],['Source',esc(c.source)]])}${c.interview?`<div class="note mt2">${I('cal')}<div>Interview ${fdate(c.interview.date)} at ${ftime(c.interview.time)} · ${esc(c.interview.mode)} · ${esc(c.interview.panel)}</div></div>`:''}${c.offer?`<div class="note mt2">${I('gift')}<div>Offer: <b>${money(c.offer.salary)}</b>/month · joining ${fdate(c.offer.joining)}</div></div>`:''}${c.reason?`<div class="note e mt2">${I('info')}<div>Rejected: ${esc(c.reason)}</div></div>`:''}${c.emp?`<div class="note mt2">${I('check')}<div>Employee ID <b>${esc(c.emp)}</b></div></div>`:''}<h4 class="mt">Notes</h4>${(c.notes||[]).map(n=>`<div class="li"><div class="grow sm">${esc(n.t)}<div class="xs mu">${esc(n.by)} · ${fdate(n.on)}</div></div></div>`).join('')||'<div class="sm mu">No notes yet.</div>'}`,
 `<button class="btn" onclick="closeModal()">Close</button>${!['Hired','Rejected'].includes(c.stage)?`<button class="btn" onclick="closeModal();noteForm('${id}')">Add note</button><button class="btn" onclick="closeModal();interviewForm('${id}')">Schedule interview</button><button class="btn" onclick="closeModal();offerForm('${id}')">Make offer</button><button class="btn" onclick="closeModal();rejectCand('${id}')">Reject</button><button class="btn pri" onclick="closeModal();hireCand('${id}')">Hire</button>`:''}`,'w')}
function candForm(){const open=TN.recruit.jobs.filter(j=>j.status==='Open');if(!open.length)return toast('Post an open job first','er');openForm({title:'Add candidate',data:{job:open[0].id,name:'',email:'',phone:'',exp:0,source:'Referral'},fields:[{k:'job',l:'Job',t:'select',o:open.map(j=>({v:j.id,l:j.title})),sp:6},{k:'name',l:'Full name',req:1,sp:3},{k:'email',l:'Email',t:'email',req:1,sp:3},{k:'phone',l:'Phone',sp:3},{k:'exp',l:'Experience (years)',t:'number',min:0,step:'0.5',sp:3},{k:'source',l:'Source',t:'select',o:['Referral','Job board','Careers page','Agency','Campus','Other'],sp:6},{k:'resume',l:'Resume (optional)',t:'file',sp:6}],save:d=>{TN.recruit.cands.unshift({id:uid('C'),job:d.job,name:d.name,email:d.email,phone:d.phone,exp:+d.exp||0,source:d.source,stage:'Applied',applied:TODAY,notes:[],rating:0});audit('Candidate added','Recruitment',d.name);save();render();toast('Candidate added')}})}

function celebOcc(from,to,f){f=f||{};const out=[],c=TN.celeb,idx=itemIdx();const q=(f.q||'').toLowerCase();
 const types=c.types.filter(t=>t.active&&(!f.type||t.id===f.type)&&(!f.cat||t.cat===f.cat));
 const ok=e=>(!f.dept||e.dept===f.dept)&&(!f.loc||e.loc===f.loc)&&(!f.team||f.team.includes(e.id))&&(!q||(e.first+' '+e.last+' '+e.id).toLowerCase().includes(q));
 for(let d=from;d<=to;d=D.add(d,1)){
  for(const t of types){
   if(t.trigger==='auto'){for(const r of autoOn(t,d)){const e=r.e;if(!ok(e)||!ctEligible(t,e,d))continue;out.push({t,e,date:d,years:r.years,item:idx.get(ciKey(t,e.id,d)),kind:'auto'})}}
   else if(t.trigger==='recurring'&&(t.dates||[]).includes(d)&&!q){out.push({t,e:null,date:d,kind:'company',item:null,ev:c.events.find(v=>v.type===t.id&&v.date===d)})}
  }
 }
 const it=c.items.filter(i=>i.date>=from&&i.date<=to&&i.scope!=='auto-dup');
 const have=new Set(out.map(o=>o.t.id+'|'+(o.e?o.e.id:'')+'|'+o.date));
 for(const i of it){const t=ctById(i.type);if(!t||(f.type&&t.id!==f.type)||(f.cat&&t.cat!==f.cat))continue;const e=i.emp?emp(i.emp):null;if(e&&!ok(e))continue;if(!e&&(f.dept||f.team)&&i.dept!==f.dept)continue;if(!e&&f.loc&&i.loc&&i.loc!==f.loc)continue;if(q&&!(e&&(e.first+' '+e.last+' '+e.id).toLowerCase().includes(q)))continue;
  const k=t.id+'|'+(e?e.id:'')+'|'+i.date;if(have.has(k)){continue}
  if(t.trigger==='recurring'&&!e)continue;out.push({t,e,date:i.date,item:i,kind:'item',years:i.years})}
 if(!q)for(const v of c.events){if(v.date<from||v.date>to||v.status==='Cancelled')continue;const t=ctById(v.type);if(!t||(f.type&&t.id!==f.type)||(f.cat&&t.cat!==f.cat)||f.dept||f.team)continue;if(out.some(o=>o.ev===v||(o.t.id===v.type&&o.date===v.date&&o.kind==='company')))continue;out.push({t,e:null,date:v.date,kind:'event',ev:v,item:null})}
 out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.t.name<b.t.name?-1:1);return out}

function wmCell(e,d){const st=dayStatus(e,d);if(st.k==='O')return{c:'off',t:'Off'};if(st.k==='H')return{c:'off',t:'Hol'};if(st.k==='L')return{c:'lv',t:'Leave'};if(d<e.joining||(e.lwd&&d>e.lwd))return{c:'off',t:'—'};const m=modeOn(e,d);return{c:m==='Office'?'of':'wf',t:m==='Office'?'Office':'WFH',m}}
